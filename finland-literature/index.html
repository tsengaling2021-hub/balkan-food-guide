<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3ea"><title>芬蘭文學與故事｜手機閱讀書</title><style>:root{--ink:#172a36;--muted:#5b6c77;--cream:#f6f3ea;--accent:#336b79;--fs:20px}*{box-sizing:border-box}body{margin:0;background:#e6e7e5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}button,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;max-width:1050px;margin:auto;padding:10px 14px}header strong{font-size:17px}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.controls button,.controls select,.nav button,.nav select{border:1px solid #ccd7d9;background:white;border-radius:12px;padding:9px 12px;color:#234c5b}.controls button.active{background:#285769;color:white}.stage{height:calc(100dvh - 125px);min-height:360px;display:flex;align-items:center;justify-content:center;padding:3px 12px}.paper{position:relative;width:min(100%,560px);height:100%;max-height:900px;border-radius:17px;background:var(--cream);box-shadow:0 5px 26px #14323d20;overflow:hidden;display:flex;flex-direction:column}.paper.landscape{width:min(100%,1020px)}.banner{height:23%;min-height:100px;background:linear-gradient(122deg,#142d42,#477686 52%,#abc0ba);position:relative;overflow:hidden;flex-shrink:0}.banner:before{content:' ';position:absolute;inset:0;background:radial-gradient(circle at 79% 36%,#fff8cfaa 0 8%,transparent 9%),repeating-linear-gradient(83deg,transparent 0 15px,#153f4d77 16px 20px,transparent 21px 51px);opacity:.75}.landscape .banner{height:25%}.symbol{position:absolute;right:8%;bottom:4%;font-size:58px;filter:drop-shadow(0 5px 5px #172e3f66)}.banner .eyebrow{position:absolute;bottom:13px;left:24px;color:#fff;font-size:14px;letter-spacing:.12em;font-weight:700}.content{padding:18px 24px 10px;overflow:auto;flex:1;scrollbar-width:thin}.content h1{font-size:calc(var(--fs)*1.45);margin:0 0 3px;line-height:1.3}.content h2{font-size:calc(var(--fs)*.82);color:#537582;margin:0 0 15px;font-weight:500}.content p{font-size:var(--fs);line-height:1.72;letter-spacing:.025em;margin:0 0 15px}.insight{font-size:calc(var(--fs)*.82);line-height:1.6;border-left:3px solid #d3a566;background:#f1e9d9;padding:11px 13px;border-radius:0 10px 10px 0}.pagefoot{padding:8px 24px 12px;display:flex;justify-content:space-between;color:#60747b;font-size:12px;background:var(--cream)}.nav{max-width:1050px;margin:0 auto;display:flex;justify-content:center;gap:7px;padding:8px 12px;align-items:center}.nav select{max-width:180px}.hint{font-size:11px;color:#667b80;text-align:center;padding:0 0 6px}.landscape .content{padding-left:7%;padding-right:7%}.landscape .content p{line-height:1.62}@media(max-width:520px){header{padding:8px}.controls button,.controls select,.nav button,.nav select{padding:8px;font-size:13px}.stage{height:calc(100dvh - 144px);padding:2px 7px}.content{padding:15px 19px}.content p{margin-bottom:11px}.paper{border-radius:12px}.banner{min-height:85px}.symbol{font-size:43px}}</style></head><body><header><strong>芬蘭文學與故事 <small style="color:#69818a">28+1頁</small></strong><div class="controls"><button data-layout="portrait">▯ 直式</button><button data-layout="landscape">▭ 橫式</button><select id="font" aria-label="文字大小"><option value="16">小字</option><option value="20">中字</option><option value="23">大字</option><option value="26">特大字</option></select></div></header><main class="stage"><article id="paper" class="paper"><div class="banner"><span id="category" class="eyebrow"></span><span id="symbol" class="symbol"></span></div><section class="content" id="content"></section><div class="pagefoot"><span id="foot"></span><span id="fit">自動排版</span></div></article></main><nav class="nav"><button id="prev" aria-label="上一頁">← 上一頁</button><select id="jump" aria-label="頁次選擇"></select><button id="next" aria-label="下一頁">下一頁 →</button><span id="counter"></span></nav><div class="hint">左右滑動可翻頁 · 選擇頁次直接跳轉 · 閱讀設定會保留</div><script>const pages=[["封面","一隻野兔，一場雪","芬蘭文學故事集","五部小說，五種生命的選擇。這不是景點導覽，而是一趟從小說人物出發的北國閱讀旅程。","我們將走入森林，遇見一隻改變人生的野兔；走進冬天，陪姆米認識孤獨；再由七兄弟、貧農與兩位女性的命運，看見芬蘭及鄰近波羅的海地區的歷史。","封面","🌲"],["閱讀方法","用故事，而不是清單","給旅途中的你","全書分成五部作品。每一頁只談一個故事轉折或人物問題，讓手機閱讀時能有真正的停頓。","每篇的「途中想想」是給自己的觀察提問，不是小說情節；旅程中的城市如果沒有出現在原著，我們也不會把它們說成作品現場。","先讀哪本？輕鬆選《遇見野兔的那一年》；想讀雪景選《姆米谷的冬天》。","📖"],["01 野兔","一場意外之後","《遇見野兔的那一年》","記者瓦塔寧本來過著看似正常的生活：工作、婚姻、城市中的責任，日子卻越來越缺乏熱情。某次汽車撞傷一隻野兔，他下車尋找，抱起這個小生命。","這個小小的停頓改變一切。當同伴催他回到原來的行程時，他卻沿著野兔走進森林。重要的不是他逃往哪裡，而是第一次選擇不照原定路線走。","你有沒有因為一件小事，突然想改變既定的生活？","🐇"],["01 野兔","留下來，或轉身離開","一段逃離日常的旅途","小說的冒險並非一場精心規畫的休假。瓦塔寧的決定讓既有的人際關係、工作與社會期待逐漸失去控制。他也沒有立刻變成完美的自由人。","一個成年人與一隻野兔的同行，在旁人眼中總顯得古怪。他們偶爾獲得善意，也會撞上誤會、規矩與麻煩。帕西里納把這些衝突寫得一本正經，因此格外好笑。","在陌生城市散步時，什麼地方讓你想多留五分鐘？","🌿"],["01 野兔","自由不是沒有代價","瓦塔寧的真正難題","森林不像城市有固定的時間表，卻並非毫無規則。天氣、食物、動物的需求，會迫使瓦塔寧重新安排自己。","他越走越遠，也越難用原來的身分解釋自己的選擇。小說最動人的地方，不是宣告離開社會就能幸福，而是問：當一個人終於能自己決定方向，他願意承擔什麼？","芬蘭林間公路旁的樹木，為何會令人想到一種與城市不同的時間？","🌲"],["01 野兔","帕西里納的冷面幽默","作家的森林人生","亞托・帕西里納（Arto Paasilinna，1942—2018）是芬蘭暢銷作家，也曾任記者。他的作品常把普通人拋進離奇處境，讓官僚制度、社會規矩與人性的固執被重新照亮。","《遇見野兔的那一年》出版於1975年，後來成為他最具代表性的作品之一。那隻野兔並不會給人講大道理，卻把主角帶向他原本不敢走的道路。","把這本書當成一段荒誕的人生實驗，會比把它當成勵志書更有趣。","✍️"],["01 野兔","小說讀到最後","劇透與主題","故事在一連串更加荒誕的事件後，仍然延續瓦塔寧不願回到舊秩序的選擇。帕西里納沒有把他的命運收束成安穩的回家故事，而是讓自由保持難以歸類的形狀。","野兔既像夥伴，也像那個最初的理由：主角只要願意照顧眼前的生命，就能暫時不受城市的語言定義。讀完後，問題或許不是「他是否成功」，而是「誰有權定義成功」。","旅行時看到馴鹿或野生動物，不要靠近餵食；觀察動物也需要尊重牠們的界線。","🐾"],["02 姆米","第一個醒來的冬天","《姆米谷的冬天》","姆米一家習慣在冬季安睡。某個冬天，姆米卻意外醒來，發現周圍是陌生的白色世界，家人仍沉沉睡著。原本熟悉的姆米谷，忽然變成一個沒有解說員的地方。","對小姆米來說，雪不只是美麗風景。它會冰冷、會擋住道路，也讓昨天習以為常的生活規則失去作用。他必須開始自己認識冬天。","在芬蘭雪地裡，試著分辨不同的聲音：腳步、風、積雪與遠方的車聲。","❄️"],["02 姆米","當世界不照你的想法運作","遇見冬天的居民","醒來的姆米，逐漸遇見能夠在寒冬中生活的各種角色。有人熟悉冰雪，有人保持距離，有人有自己的節奏。","姆米起初希望世界恢復原狀，慢慢才明白：冬天並不是錯誤的季節。那些看似古怪的冬季居民，也不是專程為他的恐懼而存在。成長從學會理解他人的生活開始。","遇見陌生的習慣時，先問「為什麼會這樣」，而不是急著比較好壞。","🧣"],["02 姆米","冰雪中的孤獨","不必立刻變勇敢","這部童話的精妙之處，是沒有急著讓主角克服孤獨。姆米會害怕，會想念家人，也會對未知感到困惑。他只是一步步走出去，逐漸發現自己有能力面對。","閱讀它像是聽見雪落下的聲音：故事裡的冷清不只是悲傷，也是一種空間，使人聽見自己原來沒有發現的心聲。","旅途裡是否也需要一段不拍照、不趕行程的安靜時間？","🌨️"],["02 姆米","朵貝・楊笙的世界","畫家與小說家","朵貝・楊笙（Tove Jansson，1914—2001）出生於赫爾辛基的藝術家庭，是以瑞典語創作的芬蘭作家與藝術家。姆米系列不只屬於兒童，也常寫成人同樣熟悉的孤獨、關係與自由。","《姆米谷的冬天》1957年出版。她筆下的角色各自有性格，不必全部變成同一種「好人」，卻能互相容納。這是她作品溫柔而不甜膩的原因。","到赫爾辛基時，記得芬蘭除了芬蘭語，也有瑞典語的文化傳統。","🎨"],["02 姆米","冬天不會永遠停留","故事的回聲","隨著季節轉換，姆米漸漸接受冬天是世界的一部分。當春天重新靠近，改變的不只是景色，還有他看待陌生事物的方式。","這部作品不告訴讀者「勇敢的人都不孤獨」。它說的是：害怕和好奇可以同時存在，成長往往發生在兩者之間。","如果看見黑夜中的燈光，你想到的是安全、孤單，還是有人正在等你？","🌅"],["03 七兄弟","七個不服管教的年輕人","《七兄弟》","阿歷克西斯・基維的小說從一群性格頑強的兄弟開始。他們不喜歡被規矩約束，也不願輕易接受讀寫、宗教和村社對成年人的要求。","他們彼此吵架、開玩笑，也不斷犯錯。讀者很難把他們想成理想化的民族英雄；正因為如此，這些人物才帶著真實的生命力。","旅行路上看到安靜小城時，想想它以前也曾有喧鬧的農村社會。","👥"],["03 七兄弟","逃進森林並不代表自由","從村莊到荒野","兄弟們想離開村落的壓力，往森林深處尋找自己的生活。森林給了他們可以呼吸的空間，也帶來務農、食物、天氣與生存的問題。","原來拒絕社會規矩並不會自動使人長大。兄弟們的狂放與笨拙，恰好讓小說中的成長不是一句教訓，而是一連串挫折。","窗外的森林雖然浪漫，對過去的農村居民卻也意味著勞動與風險。","🏡"],["03 七兄弟","學會與世界共同生活","小說的轉變","七兄弟在漫長而曲折的過程中逐漸成熟。真正的改變不是每個人變成乖順的模範，而是開始能承擔關係、責任與社會生活。","《七兄弟》1870年出版，後來被視為芬蘭語小說史的重要作品。它塑造的不是天生優秀的人，而是一群必須學習如何成為大人的普通人。","看到芬蘭語標誌時，記得它曾經也需要靠文學建立文化地位。","📚"],["03 七兄弟","阿歷克西斯・基維","用芬蘭語寫出自己的世界","阿歷克西斯・基維（Aleksis Kivi，1834—1872）在芬蘭語文學史具有核心地位。他所處的時代，芬蘭語文學仍在形成更廣泛的社會聲音。","《七兄弟》起初並未獲得一致讚美；它的粗獷、衝突與口語感曾引起批評。如今，它反而讓我們看見：民族文學未必要把人民寫得完美。","文學可以保留一個社會最不整齊、也最真實的部分。","🖋️"],["04 神聖的貧困","一個平凡人的艱難一生","《神聖的貧困》","西倫佩筆下的尤西・托伊沃拉生於貧困的鄉村世界。人生的重大變化不是由他一手控制：家庭境遇、工作條件與時代動盪，不斷縮小他可選擇的道路。","閱讀這樣的小說需要放慢速度。作者並不急著替主角找一個戲劇化勝利，而是讓我們看見一個普通人如何被經濟與社會力量推移。","看見今日芬蘭的安定時，也可以想到它經過的艱苦農村歲月。","🌾"],["04 神聖的貧困","當個人被時代捲入","1918年的陰影","芬蘭1917年獨立後，1918年爆發內戰，社會衝突迅速變得殘酷。小說把這段歷史放進尤西的命運之中，使政治不再只是課本上的派別與年份。","讀者知道更多的大局，人物卻不一定能理解自己正被什麼力量帶往何處。這種知識與無力之間的落差，正是作品令人難忘的地方。","芬蘭獨立不是故事終點，社會還必須學習如何面對分裂。","🕰️"],["04 神聖的貧困","西倫佩的眼光","諾貝爾文學獎得主","法蘭斯・埃米爾・西倫佩（F. E. Sillanpää，1888—1964）以描寫芬蘭農村生活與人和自然的關係著稱，1939年獲諾貝爾文學獎。","他的作品讓被歷史遮住的普通人物重新有了面孔。比起英雄傳記，他更關心一個人在有限條件下如何生活，以及自然與季節怎樣進入人的命運。","旅行時看似安靜的湖與田野，也曾見證艱難的歷史。","🏅"],["04 神聖的貧困","一種悲劇的重量","帶著憐憫閱讀","這部作品不適合用「正確選擇就能改變人生」來理解。它提醒讀者：人的處境常常先於選擇而存在。","當尤西的命運逐漸走向悲劇，真正值得思考的不是如何責備他，而是一個社會在危機中是否仍能看見弱者。這也是閱讀歷史小說的價值。","看待別國歷史時，除了國家成就，也試著記住那些無名者。","🍂"],["05 救贖","兩個女人，一段被掩藏的歷史","《救贖》／《清洗》","索菲・奧克莎儂的小說以愛沙尼亞為主要背景。年老的阿莉德與年輕的札拉在一個充滿恐懼與祕密的空間相遇。兩人之間的關係，隨著敘事在不同年代跳接而逐漸清晰。","她們所承受的暴力不只有私人層面，也與二十世紀的占領、監控、背叛及政治恐懼相互交纏。這不是輕鬆的旅行小說，而是一部關於創傷的作品。","這部小說主要發生在愛沙尼亞，不是芬蘭旅遊景點故事。","🕯️"],["05 救贖","秘密為何無法輕易說出","記憶與羞恥","小說最有力量的部分，是人物無法把過往整齊地說成一段故事。當生命受到威脅，沉默有時成為保護，也可能成為另一種囚禁。","奧克莎儂把家庭關係寫成歷史的裂縫：同一個屋簷下，未必有人知道另一個人經歷過什麼；而未被說出的往事，也不會因此消失。","當一個國家談到自己的過去，誰的聲音最容易被忽略？","🪟"],["05 救贖","芬蘭與愛沙尼亞之間","作家的跨境視角","索菲・奧克莎儂（Sofi Oksanen，1977—）出生於芬蘭于韋斯屈萊，母親來自愛沙尼亞。她的創作反覆探問記憶、身分、女性處境與政治暴力。","《救贖》原作2008年出版，也以《清洗》為中文書名。它讓芬蘭文學的視線跨過芬蘭灣，理解相鄰地區的二十世紀經歷。","你的行程會經過于韋斯屈萊；那是作者的出生城市，但不是小說故事的主要舞台。","🌊"],["05 救贖","揭開秘密的代價","閱讀前的提醒","這部小說涉及性暴力、人口剝削與戰爭時期的傷害，閱讀時不妨分段進行。故事將人物的恐懼與選擇逐層揭開，讓「救贖」不只是單純的原諒。","它向讀者提出更困難的問題：一段遭到壓抑的歷史要如何被承認？當受害與加害的界線在個人身上糾纏，我們又該如何理解人的複雜？","若旅行時想讀輕鬆作品，這本可以留待回國後細讀。","🩶"],["途中閱讀","拉普蘭：雪中的五感","雪不是小說的背景板","到了凱米、羅瓦涅米與拉普蘭，試著留意低矮的冬陽、積雪吸音後的安靜、道路旁結霜的樹枝。這些細節會讓《姆米谷的冬天》的陌生感有了具體的形狀。","再想想《遇見野兔的那一年》：當我們在巴士上看到一望無際的林地，對旅人而言是美景，對野生動物和當地人卻是生活的空間。","觀察：同一片雪，上午與傍晚的顏色差了多少？","🌌"],["途中閱讀","羅瓦涅米：故事如何成為地方","從聖誕老人到姆米","聖誕老人村展現北方故事如何轉化為旅遊文化；姆米則是芬蘭文學走向全球的另一種方式。兩者都和想像力有關，卻不是同一個故事系統。","別把所有北歐角色都混成同一套傳說：聖誕老人村在羅瓦涅米；姆米來自朵貝・楊笙的創作。了解差異，比只拍一張打卡照更有趣。","觀察：孩子與成年人在童話場所裡，最容易被什麼吸引？","🎄"],["途中閱讀","庫奧皮奧與于韋斯屈萊","城市裡的文學時間","庫奧皮奧讓我們看到芬蘭中部城市的生活節奏；于韋斯屈萊則與索菲・奧克莎儂的出生背景相連。這些關係不等於小說每個場景都發生在此。","穿過市中心時，看看圖書館、學校、街上的雙語或單語標示。文學不是與現代生活隔絕的博物館，而是不斷在日常語言中被重新創作。","觀察：你在這座城市最想寫下一個怎樣的角色？","🏘️"],["途中閱讀","赫爾辛基：語言與海","一個國家不只有一種聲音","赫爾辛基是朵貝・楊笙出生與生活的重要城市。芬蘭有芬蘭語與瑞典語兩種國家語言，而以瑞典語寫作的楊笙，正提醒我們不要把國家與單一語言畫上等號。","在首都的街道、教堂與港口之間，試著想像不同世代的作家如何理解同一座城市：有人書寫童話，有人書寫社會，有人把記憶帶向海的另一邊。","觀察：一座城市的海港，代表邊界，還是與世界連結的入口？","⛴️"],["尾聲","帶一本小說回到日常","你自己的芬蘭故事","五部作品表面差異很大：一場突然離開的冒險、一個醒來的冬天、七個學著長大的兄弟、一名農民的悲劇，以及兩位女性背後的沉默。","它們共同提醒我們：所謂芬蘭文學，不只有自然、寧靜和幸福，也有衝突、幽默、脆弱、選擇與記憶。旅程結束後，願你還記得一個角色、一場雪，或自己在某個下午曾經想過的問題。","本書是原創導讀與旅行觀察，非小說全文；部分情節有劇透。","✨"]];let current=0;let size=Number(localStorage.getItem('fin-size')||20);let layout=localStorage.getItem('fin-layout')||'portrait';const paper=document.getElementById('paper'),content=document.getElementById('content'),selector=document.getElementById('jump');pages.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1).toString().padStart(2,'0')+'｜'+p[1];selector.append(o)});function draw(){let p=pages[current];document.getElementById('category').textContent=p[0];document.getElementById('symbol').textContent=p[6];content.innerHTML='<h1>'+p[1]+'</h1><h2>'+p[2]+'</h2><p>'+p[3]+'</p><p>'+p[4]+'</p><div class="insight"><b>途中想想｜</b>'+p[5]+'</div>';document.getElementById('counter').textContent=(current+1)+' / '+pages.length;document.getElementById('foot').textContent='芬蘭文學與故事 · '+p[0];selector.value=current;paper.classList.toggle('landscape',layout==='landscape');document.documentElement.style.setProperty('--fs',size+'px');document.querySelectorAll('[data-layout]').forEach(b=>b.classList.toggle('active',b.dataset.layout===layout));document.getElementById('font').value=size;content.scrollTop=0;requestAnimationFrame(fit);localStorage.setItem('fin-page',current)}function fit(){let target=size;document.documentElement.style.setProperty('--fs',target+'px');while(content.scrollHeight>content.clientHeight+3&&target>14){target-=1;document.documentElement.style.setProperty('--fs',target+'px')}document.getElementById('fit').textContent=target<size?'已自動縮排以適合螢幕':'自動排版';}function go(n){current=Math.min(pages.length-1,Math.max(0,n));draw()}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);selector.onchange=e=>go(+e.target.value);document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;localStorage.setItem('fin-layout',layout);draw()});document.getElementById('font').onchange=e=>{size=+e.target.value;localStorage.setItem('fin-size',size);draw()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});let sx=0;paper.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});paper.addEventListener('touchend',e=>{const diff=e.changedTouches[0].clientX-sx;if(Math.abs(diff)>80)go(current+(diff<0?1:-1))},{passive:true});window.addEventListener('resize',fit);current=Math.min(pages.length-1,Math.max(0,Number(localStorage.getItem('fin-page')||0)));draw();</script></body></html>
