<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11/24 陵園路・美齡宮・明孝陵</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f1e6;color:#2d4439;font:17px/1.65 -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main{max-width:650px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;padding:12px 0}h1{font-size:1.45rem;line-height:1.4;margin:5px 0 18px}img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid #cfc1a5}section{background:#fffefa;padding:18px;margin:18px 0;border-radius:18px}h2{font-size:1.1rem;margin:0 0 10px}a{color:#176352}nav{display:grid;grid-template-columns:1fr 1fr;gap:9px}nav a{padding:12px;border-radius:12px;background:#e8f1e9;text-decoration:none;font-weight:700}nav span{display:block;font-size:13px;font-weight:400}p{margin:8px 0}@media(max-width:340px){nav{grid-template-columns:1fr}}</style></head><body><main><header><a href="./index.html">← 12 日行程</a><strong>南京 11/24</strong></header><h1>陵園路・美齡宮・明孝陵</h1><img src="./assets/routes/2026-11-24/NJ04_20261124_lingyuan_meiling_mingxiaoling_v02.svg" alt="地鐵苜蓿園站、陵園路梧桐大道、美齡宮十朝文化園、明孝陵7號門與明孝陵景區的步行及接駁順序圖"><section><h2>今日走法</h2><p>搭地鐵 2 號線至苜蓿園站，步行欣賞陵園路梧桐大道，抵達美齡宮。遊覽後由<strong>美齡宮（十朝文化園）</strong>站搭景區觀光車，經海底世界、東郊國賓館前往<strong>明孝陵 7 號門</strong>。</p><p>景區內各景點間的實際步行道路，依現場指標及高德地圖導航。</p></section><section><h2>景點導航</h2><nav><a href="https://uri.amap.com/search?keyword=%E5%8D%97%E4%BA%AC%E8%8B%9C%E8%93%BF%E5%9B%AD%E5%9C%B0%E9%93%81%E7%AB%99&amp;city=%E5%8D%97%E4%BA%AC">苜蓿園站 <span>開啟高德</span></a><a href="https://uri.amap.com/search?keyword=%E5%8D%97%E4%BA%AC%E9%99%B5%E5%9B%AD%E8%B7%AF%E6%A2%A7%E6%A1%90%E5%A4%A7%E9%81%93&amp;city=%E5%8D%97%E4%BA%AC">陵園路 <span>開啟高德</span></a><a href="https://uri.amap.com/search?keyword=%E5%8D%97%E4%BA%AC%E7%BE%8E%E9%BE%84%E5%AE%AB%E5%8D%81%E6%9C%9D%E6%96%87%E5%8C%96%E5%9B%AD&amp;city=%E5%8D%97%E4%BA%AC">美齡宮 <span>開啟高德</span></a><a href="https://uri.amap.com/search?keyword=%E5%8D%97%E4%BA%AC%E6%98%8E%E5%AD%9D%E9%99%B57%E5%8F%B7%E9%97%A8&amp;city=%E5%8D%97%E4%BA%AC">明孝陵 7 號門 <span>開啟高德</span></a></nav></section><section><h2>接駁與門票</h2><p>官方公布觀光車單次人民幣 10 元、當日不限次 30 元；現場班次與營運依當日公告。美齡宮與明孝陵分別購票，也可評估官方聯票。</p><p><a href="https://zschina.nanjing.gov.cn/lyzx/202602/t20260214_5794915.html">南京鐘山景區交通資訊</a></p></section></main></body></html>
