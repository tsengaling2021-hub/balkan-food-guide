← 11/20 當日所有選項</a><a class="current" href="./route-06-botanical.html">上海植物園</a></nav><main><header><a href="./index.html">← 12 日行程</a><strong>上海 06｜11/20</strong></header><h1>上海植物園・秋日散策</h1><!-- INTEGRATED_ROUTE_ART_V1 --><figure class="main-art-illustration" id="route-art" aria-label="11-20 上海植物園路線圖"><h2>🍁 11-20｜上海植物園｜路線彩繪圖</h2><img src="./assets/watercolor_staging/SH06.jpg" loading="eager" alt="11-20 上海植物園四站路線插畫" /><figcaption>本圖為景點彩繪行程視覺，交通、入口與分店仍以當日路線導航資訊為準。</figcaption><nav class="image-next"><a href="./route-sh06-field.html#route-story">🍽 餐飲・拍照・探店</a><a href="./index.html#date-main-menu">⌂ 日期主選單</a></nav></figure><!-- END_INTEGRATED_ROUTE_ART_V1 --><section><h2>搭地鐵入園</h2><p>搭乘地鐵 3 號線至石龍路站，經天橋、東泉路前往羅城路的<strong>4 號門</strong>。若選擇龍吳路 1111 號，則是另一處<strong>1 號門</strong>。</p><div class="links"><a href="https://uri.amap.com/search?keyword=%E4%B8%8A%E6%B5%B7%E6%A4%8D%E7%89%A9%E5%9B%AD4%E5%8F%B7%E9%97%A8&amp;city=%E4%B8%8A%E6%B5%B7">導航至 4 號門</a><a href="https://uri.amap.com/search?keyword=%E4%B8%8A%E6%B5%B7%E6%A4%8D%E7%89%A9%E5%9B%AD1%E5%8F%B7%E9%97%A8&amp;city=%E4%B8%8A%E6%B5%B7">導航至 1 號門</a></div><p class="muted">點擊後開啟高德地圖搜尋；請依現場開放入口及步行路徑導航。</p></section><section><h2>園內慢遊</h2><p>入園後依現場指標選擇溫室、盆景與季節花木展區，保留休息時間。園區開放及溫室票務以現場公告為準。</p></section></main><!-- GUIDE_RETURN_OPTION_V1 --><div style="height:58px"></div><nav aria-label="頁尾返回" style="position:sticky;bottom:0;z-index:65;display:flex;gap:7px;padding:8px;background:#f8f5ecf5;border-top:1px solid #d6e2d5"><a href="./day-20.html#all-options" style="flex:1;text-align:center;padding:13px 6px;text-decoration:none;background:#216c54;color:white;border-radius:11px;font-weight:800">← 11/20 所有選項</a><a href="./index.html#date-main-menu" style="flex:1;text-align:center;padding:13px 6px;text-decoration:none;background:#e3efe5;color:#205743;border-radius:11px;font-weight:800">⌂ 日期主選單</a></nav></body></html>
