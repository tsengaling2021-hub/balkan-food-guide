<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#29584b"><title>上海植物園｜11/20 上海06</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#263d34;font:17px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:680px;margin:auto;padding:14px}a{color:#176150}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}header a{text-decoration:none;font-weight:700}h1{font-size:1.4rem;line-height:1.35;margin:6px 0 14px}img{width:100%;height:auto;display:block;border-radius:18px;border:1px solid #d9c6a8}section{margin:17px 0;background:#fffdf8;padding:16px;border-radius:16px}h2{font-size:1.08rem;margin:0 0 8px}p{margin:8px 0}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}.links a{display:block;background:#e5f1e8;border-radius:12px;padding:12px 8px;text-align:center;text-decoration:none;font-weight:700}.muted{color:#65766d;font-size:.9rem}@media(max-width:350px){.links{grid-template-columns:1fr}}</style></head><body><main><header><a href="./index.html">← 12 日行程</a><strong>上海 06｜11/20</strong></header><h1>上海植物園・秋日散策</h1><img src="./assets/routes/2026-11-20/option-06-botanical-garden-entrances.svg" alt="上海植物園兩處入口及展覽溫室秋景導覽圖，4號門在羅城路151號、1號門在龍吳路1111號"><section><h2>搭地鐵入園</h2><p>搭乘地鐵 3 號線至石龍路站，經天橋、東泉路前往羅城路的<strong>4 號門</strong>。若選擇龍吳路 1111 號，則是另一處<strong>1 號門</strong>。</p><div class="links"><a href="https://uri.amap.com/search?keyword=%E4%B8%8A%E6%B5%B7%E6%A4%8D%E7%89%A9%E5%9B%AD4%E5%8F%B7%E9%97%A8&amp;city=%E4%B8%8A%E6%B5%B7">導航至 4 號門</a><a href="https://uri.amap.com/search?keyword=%E4%B8%8A%E6%B5%B7%E6%A4%8D%E7%89%A9%E5%9B%AD1%E5%8F%B7%E9%97%A8&amp;city=%E4%B8%8A%E6%B5%B7">導航至 1 號門</a></div><p class="muted">點擊後開啟高德地圖搜尋；請依現場開放入口及步行路徑導航。</p></section><section><h2>園內慢遊</h2><p>入園後依現場指標選擇溫室、盆景與季節花木展區，保留休息時間。園區開放及溫室票務以現場公告為準。</p></section></main></body></html>
