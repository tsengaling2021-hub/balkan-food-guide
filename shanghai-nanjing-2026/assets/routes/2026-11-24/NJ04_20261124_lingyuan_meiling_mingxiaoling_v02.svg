<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" role="img"><title>NJ04 11月24日陵園路美齡宮明孝陵實際站點順序與接駁圖</title><rect width="900" height="1450" fill="#faf3e5"/><rect x="28" y="24" width="844" height="1400" rx="30" fill="#fffdf7" stroke="#b5a588" stroke-width="3"/><text x="66" y="91" font-size="43" font-weight="bold" fill="#693d31">南京 NJ04｜11/24</text><text x="66" y="148" font-size="40" font-weight="bold" fill="#315746">陵園路・美齡宮・明孝陵</text><text x="66" y="197" font-size="23" fill="#72695c">實際景區站點順序 · 步行與接駁分開</text><g fill="#e4b55b" opacity=".55"><circle cx="750" cy="270" r="55"/><circle cx="760" cy="670" r="65"/><circle cx="130" cy="1000" r="55"/></g><rect x="145" y="232" width="660" height="144" rx="18" fill="#eaf1e8"/><circle cx="101" cy="290" r="37" fill="#b75639"/><text x="101" y="302" text-anchor="middle" font-size="35" font-weight="bold" fill="#fff">1</text><text x="173" y="275" font-size="32" font-weight="bold" fill="#294e40">苜蓿園站</text><text x="173" y="317" font-size="23" fill="#605c50">地鐵 2 號線</text><text x="173" y="353" font-size="22" fill="#736d62">步行進入陵園路</text><path d="M101 330V462" stroke="#b75639" stroke-width="13" /><rect x="145" y="447" width="660" height="144" rx="18" fill="#f3f0e4"/><circle cx="101" cy="505" r="37" fill="#b75639"/><text x="101" y="517" text-anchor="middle" font-size="35" font-weight="bold" fill="#fff">2</text><text x="173" y="490" font-size="32" font-weight="bold" fill="#294e40">陵園路梧桐大道</text><text x="173" y="532" font-size="23" fill="#605c50">梅花谷路 → 四方城東路</text><text x="173" y="568" font-size="22" fill="#736d62">沿道路步行賞秋</text><path d="M101 545V677" stroke="#b75639" stroke-width="13" /><rect x="145" y="662" width="660" height="144" rx="18" fill="#eaf1e8"/><circle cx="101" cy="720" r="37" fill="#b75639"/><text x="101" y="732" text-anchor="middle" font-size="35" font-weight="bold" fill="#fff">3</text><text x="173" y="705" font-size="32" font-weight="bold" fill="#294e40">美齡宮（十朝文化園）</text><text x="173" y="747" font-size="23" fill="#605c50">美齡宮景點及接駁站</text><text x="173" y="783" font-size="22" fill="#736d62">從此搭景區觀光車</text><path d="M101 760V892" stroke="#3179a1" stroke-width="13" stroke-dasharray="15 12"/><rect x="145" y="877" width="660" height="144" rx="18" fill="#f3f0e4"/><circle cx="101" cy="935" r="37" fill="#3179a1"/><text x="101" y="947" text-anchor="middle" font-size="35" font-weight="bold" fill="#fff">4</text><text x="173" y="920" font-size="32" font-weight="bold" fill="#294e40">明孝陵 7 號門</text><text x="173" y="962" font-size="23" fill="#605c50">景區觀光車停靠站</text><text x="173" y="998" font-size="22" fill="#736d62">入園前核對開放入口</text><path d="M101 975V1107" stroke="#3179a1" stroke-width="13" stroke-dasharray="15 12"/><rect x="145" y="1092" width="660" height="144" rx="18" fill="#eaf1e8"/><circle cx="101" cy="1150" r="37" fill="#3179a1"/><text x="101" y="1162" text-anchor="middle" font-size="35" font-weight="bold" fill="#fff">5</text><text x="173" y="1135" font-size="32" font-weight="bold" fill="#294e40">明孝陵景區</text><text x="173" y="1177" font-size="23" fill="#605c50">陵寢、石刻與秋色</text><text x="173" y="1213" font-size="22" fill="#736d62">園內按官方導覽行走</text><rect x="68" y="1320" width="765" height="70" rx="12" fill="#e7f0ea"/><text x="89" y="1350" font-size="22" fill="#325947">紅色實線：陵園路步行　藍色虛線：景區接駁</text><text x="89" y="1379" font-size="18" fill="#64766b">依南京中山陵園管理局 2026 年接駁站點編排</text></svg>