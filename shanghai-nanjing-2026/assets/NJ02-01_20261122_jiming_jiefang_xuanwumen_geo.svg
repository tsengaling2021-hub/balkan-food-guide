<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="t d"><title id="t">11月22日 南京雞鳴寺、解放門、玄武門地理定位導覽圖</title><desc id="d">依OpenStreetMap Nominatim三個已查核座標按經緯度相對位置繪製。連接虛線僅表示景點順序，不是實際步行路徑。南京城牆解放門至玄武門段官方資料約1400米。</desc><rect width="900" height="1500" fill="#f8f0dd"/><rect x="30" y="30" width="840" height="1440" rx="32" fill="#fffaf0" stroke="#8b9a85" stroke-width="4"/><text x="72" y="116" font-size="49" font-weight="bold" fill="#264b43">南京 11/22｜玄武湖・雞鳴寺</text><text x="72" y="168" font-size="26" fill="#78654a">NJ02-01｜地理定位底圖 · 秋日散策</text><path d="M680 275Q770 420 690 600T770 900T680 1190" stroke="#9cc9d2" stroke-width="135" fill="none" opacity=".58"/><path d="M680 275Q770 420 690 600T770 900T680 1190" stroke="#4e9cae" stroke-width="3" fill="none" stroke-dasharray="10 13"/><text x="715" y="725" font-size="32" fill="#2b6671" transform="rotate(90 715 725)">玄武湖</text><path d="M306 1140L345 795L645 260" stroke="#b56b51" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="13 18"/><path d="M345 795L645 260" stroke="#7b5141" stroke-width="6" fill="none" stroke-dasharray="4 12"/><path d="M345 795L645 260" stroke="#d19d72" stroke-width="2" fill="none"/><g font-family="sans-serif" font-weight="bold"><circle cx="306" cy="1140" r="42" fill="#b74838" stroke="#fff" stroke-width="7"/><text x="306" y="1153" text-anchor="middle" font-size="37" fill="white">1</text><circle cx="345" cy="795" r="42" fill="#b74838" stroke="#fff" stroke-width="7"/><text x="345" y="808" text-anchor="middle" font-size="37" fill="white">2</text><circle cx="645" cy="260" r="42" fill="#b74838" stroke="#fff" stroke-width="7"/><text x="645" y="273" text-anchor="middle" font-size="37" fill="white">3</text></g><g font-size="34" font-weight="bold" fill="#27483d"><text x="380" y="1160">① 雞鳴寺</text><text x="395" y="790">② 解放門</text><text x="340" y="235">③ 玄武門</text></g><g fill="#7e6047" font-size="24"><text x="380" y="1199">黃牆・藥師塔</text><text x="395" y="830">登城入口・台城</