<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>秋色植物圖鑑｜上海・南京賞秋12日</title><meta name="theme-color" content="#285645"><style>

<body><header><div class="wrap"><a class="home" href="./index.html#date-main-menu">⌂ 返回12日導覽主選單</a><h1>🍁 上海・南京 秋色植物圖鑑</h1><p class="intro">左邊看葉形｜右邊看整株與樹幹｜先選城市，再選景點</p></div></header><div class="toolbar"><div class="city"><button id="sh" type="button">上海</button><button id="nj" type="button">南京</button></div></div><main class="content"><section class="selector"><label for="spot">📍 選擇賞秋景點</label><select id="spot"></select><p class="note">每張植物卡提供葉形、樹幹樹形、秋色與景點提示（依植物實物照片製作水彩風格效果，景點不代表照片拍攝地）。地點以可觀賞或值得留意為主，非當日已確認變色或精確樹位。</p></section><div class="spot" id="spotinfo"></div><div class="filterbar"><button type="button" id="onlyspot">顯示此景點植物</button><button type="button" id="allcity">看本城市全部植物</button></div><div class="grid" id="cards"></div><a class="back" href="./index.html#date-main-menu">⌂ 返回日期主選單</a></main>
<script>const D={"plants":[["銀杏","扇形葉，葉脈向外放射","灰褐色縱裂樹皮；高大挺直、老樹冠開展","秋轉金黃","fan"],["懸鈴木","大掌狀3–5裂葉，常見球狀果序","樹皮斑駁片狀剝落；主幹粗壯、冠幅寬廣","秋葉黃褐，常稱法國梧桐","star"],["楓香","掌狀3裂至5裂葉，葉序互生","灰褐色縱裂樹皮；主幹挺直、冠卵圓形","橙紅到深紅","star"],["雞爪槭","掌狀深裂5–9片、裂片細尖","灰褐色較平滑樹皮；多分枝、樹冠傘形","紅葉細緻，常栽庭園","maple"],["烏桕","菱形或寬卵形葉，葉尖細長","灰褐色縱裂樹皮；冠形不規則而疏展","紅黃交錯，白色種子醒目","heart"],["水杉","線形小葉對生於羽狀側枝","紅褐色縱裂樹皮；直立主幹、圓錐形樹冠","秋冬轉銅橙色後落葉","needle"],["櫸樹","卵形葉有鋸齒、側脈清楚","灰褐色片狀剝落；寬圓形樹冠","秋轉橙黃至紅褐","oval"],["無患子","羽狀複葉，數對橢圓小葉","灰褐色樹皮；樹冠圓傘形","秋轉金黃；果皮含皂苷","compound"],["欒樹","複葉或二回羽狀複葉、蒴果如燈籠","灰褐色縱裂；樹冠圓傘形","秋葉黃、果實具觀賞性","compound"],["黃連木","偶數羽狀複葉，小葉對生或近對生","粗糙縱裂樹皮；冠形開張","秋紅橙黃，常一樹多彩","compound"]],"spots":[{"city":"上海","name":"武康路・安福路","date":"11/19–20 路線可選","items":[["懸鈴木","路段主要行道樹，秋季黃褐色"]]},{"city":"上海","name":"思南路・衡復街區","date":"上海街區路線","items":[["懸鈴木","行道樹與歷史街屋共同構成秋景"]]},{"city":"上海","name":"上海植物園","date":"SH06 備選景點","items":[["銀杏","園內可觀察，是否進入以當日路線為準"],["楓香","園林秋色樹種，需按現場植物標牌辨認"],["雞爪槭","園內槭樹展示，依現地標牌辨認"],["烏桕","園林秋色觀察，非固定保證樹位"],["水杉","可觀察杉類樹種，請與落羽杉區分"],["櫸樹","可觀察園林喬木，依現地標牌確認"],["無患子","園林及街道常見秋色樹種，依現地標牌確認"]]},{"city":"上海","name":"共青森林公園","date":"額外賞秋備選","items":[["雞爪槭","園區紅葉景觀"],["銀杏","可找秋季黃葉樹木"],["水杉","園區可觀察杉類景觀"]]},{"city":"南京","name":"玄武湖・梁洲","date":"11/22","items":[["銀杏","梁洲銀杏大道，是推薦定點"],["烏桕","沿湖留意紅黃葉，非保證定點"],["水杉","湖畔杉類需和落羽杉辨別"]]},{"city":"南京","name":"清涼山・銀杏谷","date":"11/23","items":[["銀杏","銀杏谷重點觀察；金黃秋景"]]},{"city":"南京","name":"明孝陵・陵園路","date":"11/24","items":[["懸鈴木","陵園路梧桐大道代表樹種"],["銀杏","明孝陵園區可留意"],["雞爪槭","3、4號門一帶可留意"],["欒樹","明孝陵周邊可留意"],["水杉","燕雀湖以落羽杉更出名，別把兩者混為一談"],["烏桕","園區留意彩葉樹，非固定保證點"]]},{"city":"南京","name":"鐘山・靈谷寺","date":"11/24–25 行程區域","items":[["銀杏","寺院及園林秋色"],["櫸樹","林蔭步道可能可見，須核對標牌"],["黃連木","山林可能可見，非保證定點"]]},{"city":"南京","name":"棲霞山・棲霞寺","date":"11/26","items":[["楓香","霜紅苑與桃花湖周邊，紅葉觀賞"],["雞爪槭","紅葉林區可辨認槭樹，依標牌確認"],["銀杏","寺廟與古建築周邊可留意"],["黃連木","山林可能可見，非保證定點"]]}]};const P=Object.fromEntries(D.plants.map(x=>[x[0],x]));const PHOTO={"銀杏":"ginkgo","懸鈴木":"plane","楓香":"sweetgum","雞爪槭":"maple","烏桕":"tallow","水杉":"redwood","櫸樹":"zelkova","無患子":"soapberry","欒樹":"rain","黃連木":"pistacia"};const CREDITS=[{"name":"銀杏","slug":"ginkgo","role":"leaf","source":"File:GinkgoLeaves.jpg","url":"https://commons.wikimedia.org/wiki/File:GinkgoLeaves.jpg","file":"ginkgo-leaf.webp"},{"name":"銀杏","slug":"ginkgo","role":"tree","source":"File:2014-11-02 12 06 44 Ginkgo during autumn at the Ewing Presbyterian Church Cemetery in Ewing, New Jersey.jpg","url":"https://commons.wikimedia.org/wiki/File:2014-11-02_12_06_44_Ginkgo_during_autumn_at_the_Ewing_Presbyterian_Church_Cemetery_in_Ewing%2C_New_Jersey.jpg","file":"ginkgo-tree.webp"},{"name":"懸鈴木","slug":"plane","role":"leaf","source":"File:Fallen leaf of Platanus x hispanica (1).jpg","url":"https://commons.wikimedia.org/wiki/File:Fallen_leaf_of_Platanus_x_hispanica_(1).jpg","file":"plane-leaf.webp"},{"name":"懸鈴木","slug":"plane","role":"tree","source":"File:Berkeley Square - geograph.org.uk - 911963.jpg","url":"https://commons.wikimedia.org/wiki/File:Berkeley_Square_-_geograph.org.uk_-_911963.jpg","file":"plane-tree.webp"},{"name":"楓香","slug":"sweetgum","role":"leaf","source":"File:Liquidambar formosana 02.jpg","url":"https://commons.wikimedia.org/wiki/File:Liquidambar_formosana_02.jpg","file":"sweetgum-leaf.webp"},{"name":"楓香","slug":"sweetgum","role":"tree","source":"File:Liquidambar formosana 01.jpg","url":"https://commons.wikimedia.org/wiki/File:Liquidambar_formosana_01.jpg","file":"sweetgum-tree.webp"},{"name":"雞爪槭","slug":"maple","role":"leaf","source":"File:AcerPalmatum2.jpg","url":"https://commons.wikimedia.org/wiki/File:AcerPalmatum2.jpg","file":"maple-leaf.webp"},{"name":"雞爪槭","slug":"maple","role":"tree","source":"File:FeralJapaneseMapleMD2.jpg","url":"https://commons.wikimedia.org/wiki/File:FeralJapaneseMapleMD2.jpg","file":"maple-tree.webp"},{"name":"烏桕","slug":"tallow","role":"leaf","source":"File:Tallow2232.JPG","url":"https://commons.wikimedia.org/wiki/File:Tallow2232.JPG","file":"tallow-leaf.webp"},{"name":"烏桕","slug":"tallow","role":"tree","source":"File:Autumn Triadica sebifera trees by a river in Saga.jpg","url":"https://commons.wikimedia.org/wiki/File:Autumn_Triadica_sebifera_trees_by_a_river_in_Saga.jpg","file":"tallow-tree.webp"},{"name":"水杉","slug":"redwood","role":"leaf","source":"File:Metasequoia glyptostroboides Autumn leaf color.jpg","url":"https://commons.wikimedia.org/wiki/File:Metasequoia_glyptostroboides_Autumn_leaf_color.jpg","file":"redwood-leaf.webp"},{"name":"水杉","slug":"redwood","role":"tree","source":"File:Autumn metasequoia glyptostroboides.JPG","url":"https://commons.wikimedia.org/wiki/File:Autumn_metasequoia_glyptostroboides.JPG","file":"redwood-tree.webp"},{"name":"櫸樹","slug":"zelkova","role":"leaf","source":"File:Zelkova serrata5.jpg","url":"https://commons.wikimedia.org/wiki/File:Zelkova_serrata5.jpg","file":"zelkova-leaf.webp"},{"name":"櫸樹","slug":"zelkova","role":"tree","source":"File:Zelkova serrata entire.jpg","url":"https://commons.wikimedia.org/wiki/File:Zelkova_serrata_entire.jpg","file":"zelkova-tree.webp"},{"name":"無患子","slug":"soapberry","role":"leaf","source":"File:Sapindus mukorossi2.jpg","url":"https://commons.wikimedia.org/wiki/File:Sapindus_mukorossi2.jpg","file":"soapberry-leaf.webp"},{"name":"無患子","slug":"soapberry","role":"tree","source":"File:Sapindus mukorossi2.jpg","url":"https://commons.wikimedia.org/wiki/File:Sapindus_mukorossi2.jpg","file":"soapberry-tree.webp"},{"name":"欒樹","slug":"rain","role":"leaf","source":"File:Feuille composée d'un Koelreuteria paniculata en novembre.jpg","url":"https://commons.wikimedia.org/wiki/File:Feuille_compos%C3%A9e_d%27un_Koelreuteria_paniculata_en_novembre.jpg","file":"rain-leaf.webp"},{"name":"欒樹","slug":"rain","role":"tree","source":"File:Koelreuteriapaniculatatatuape.JPG","url":"https://commons.wikimedia.org/wiki/File:Koelreuteriapaniculatatatuape.JPG","file":"rain-tree.webp"},{"name":"黃連木","slug":"pistacia","role":"leaf","source":"File:黃連木 Pistacia chinensis 20210320101416 10.jpg","url":"https://commons.wikimedia.org/wiki/File:%E9%BB%83%E9%80%A3%E6%9C%A8_Pistacia_chinensis_20210320101416_10.jpg","file":"pistacia-leaf.webp"},{"name":"黃連木","slug":"pistacia","role":"tree","source":"File:Pistacia chinensis West Berkeley 05.jpg","url":"https://commons.wikimedia.org/wiki/File:Pistacia_chinensis_West_Berkeley_05.jpg","file":"pistacia-tree.webp"}];let city="南京",idx=0,all=false;
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clr(n){return n==='銀杏'||n==='無患子'||n==='欒樹'?'#e7b72d':n==='水杉'?'#b96d3f':n==='懸鈴木'?'#b99b49':n==='雞爪槭'?'#cb3c48':'#d86b40'}
function update(){const opts=D.spots.filter(x=>x.city===city);idx=Math.min(idx,opts.length-1);const sel=$('spot');sel.innerHTML=opts.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+'（'+esc(x.date)+'）</option>').join('');sel.value=String(idx);const sp=opts[idx];$('sh').classList.toggle('active',city==='上海');$('nj').classList.toggle('active',city==='南京');$('spotinfo').innerHTML='<strong>📍 '+esc(sp.name)+'</strong><small>'+esc(sp.date)+'｜可辨識 '+sp.items.length+' 種植物</small>';$('onlyspot').classList.toggle('active',!all);$('allcity').classList.toggle('active',all);let arr=all?Array.from(new Set(opts.flatMap(x=>x.items.map(y=>y[0])))).map(n=>[n,opts.filter(x=>x.items.some(y=>y[0]===n)).map(x=>x.name).join('、')]):sp.items; $('cards').innerHTML=arr.map(([name,loc])=>{const p=P[name],color=clr(name);return '<article class="plant"><h3>'+esc(name)+'</h3><div class="art">'+'<img class="watercolor-plant" loading="lazy" decoding="async" src="./assets/autumn_botanical_watercolor/'+PHOTO[name]+'-leaf.webp" alt="'+esc(name)+'葉片實物來源的水彩風格插畫">'+
'<img class="watercolor-plant" loading="lazy" decoding="async" src="./assets/autumn_botanical_watercolor/'+PHOTO[name]+'-tree.webp" alt="'+esc(name)+'樹冠樹形實物來源的水彩風格插畫">'+'</div><div class="artlabel"><span>左｜葉片</span><span>右｜整株樹形</span></div><div class="detail"><p><b>葉片分辨：</b>'+esc(p[1])+'</p><p><b>樹幹・樹形：</b>'+esc(p[2])+'</p><p><b>植物特性：</b>'+esc(p[3])+'</p><p class="location"><b>📍 可觀賞位置：</b>'+esc(loc)+'</p><details class=photo-source><summary>彩繪圖片來源</summary>'+CREDITS.filter(c=>c.slug===PHOTO[name]).map(c=>'<a target=_blank rel=noopener href="'+esc(c.url)+'">'+(c.role==='leaf'?'葉片':'整株')+'｜Wikimedia Commons</a>').join(' · ')+'</details></div></article>'}).join('');}
$('sh').onclick=()=>{city='上海';idx=0;all=false;update()};$('nj').onclick=()=>{city='南京';idx=0;all=false;update()};$('spot').onchange=e=>{idx=+e.target.value;all=false;update()};$('onlyspot').onclick=()=>{all=false;update()};$('allcity').onclick=()=>{all=true;update()};const q=new URLSearchParams(location.search);if(q.get('city')==='shanghai')city='上海';if(q.get('city')==='nanjing')city='南京';if(q.get('spot')){const ix=D.spots.filter(s=>s.city===city).findIndex(s=>s.name.includes(q.get('spot')));if(ix>=0)idx=ix;}update();</script></body></html>
