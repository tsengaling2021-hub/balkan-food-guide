<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>秋色植物圖鑑｜上海・南京賞秋12日</title><meta name="theme-color" content="#285645"><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f8f3e9;color:#3b342b;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{padding:20px 16px 24px;background:linear-gradient(125deg,#31594b,#6e7861);color:#fff}.wrap{max-width:850px;margin:auto;padding:0 14px}h1{font-size:27px;line-height:1.28;margin:12px 0 7px}h2{font-size:21px;margin:0 0 12px}p{margin:8px 0}a{color:#1c6250}.home{display:inline-block;text-decoration:none;color:#fff;border:1px solid #ffffffaa;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:700}.intro{font-size:14px;opacity:.96}.toolbar{position:sticky;top:0;z-index:9;background:#faf7f0ed;backdrop-filter:blur(12px);padding:13px 14px;border-bottom:1px solid #e3d5bd}.city{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:850px;margin:auto}.city button{min-height:51px;border:1px solid #b5caba;background:#fff;border-radius:13px;font:800 18px inherit;font-size:18px;font-weight:800;color:#285847}.city button.active{background:#285847;color:#fff;border-color:#285847}.content{max-width:850px;margin:auto;padding:15px 14px 70px}.selector{background:#fff;border:1px solid #e3d9c7;border-radius:17px;padding:17px;margin:0 0 16px}.selector label{display:block;font-weight:800;margin-bottom:7px}.selector select{width:100%;border:1px solid #9eb6a5;background:#f8fbf8;border-radius:12px;padding:13px;font:700 17px inherit;font-size:17px;color:#285847}.note{font-size:13px;color:#726a58}.spot{background:#fffaf0;border-left:5px solid #a56836;border-radius:10px;padding:12px 14px;margin:14px 0}.spot strong{font-size:20px}.spot small{display:block;color:#786d57}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.plant{background:#fff;border:1px solid #e3d8c5;border-radius:18px;overflow:hidden;box-shadow:0 3px 9px #49331b10}.plant h3{margin:0;padding:10px 12px 5px;font-size:21px;color:#563b24}.art{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:4px;padding:2px 9px}.art svg{width:100%;height:135px;max-height:25vw}.artlabel{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:12px;color:#736b60;font-weight:750}.detail{padding:8px 12px 13px;font-size:14px;line-height:1.55}.detail p{margin:6px 0}.detail b{color:#6b3f28}.location{padding:8px 10px;background:#fff1dc;border-radius:10px;color:#7b4e26;font-size:13px}.muted{color:#706b60}.back{display:block;margin:18px auto;background:#e9eee8;text-align:center;padding:13px;border-radius:11px;font-weight:800;text-decoration:none}.filterbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.filterbar button{border:1px solid #d4c7af;background:#fff;border-radius:20px;padding:7px 12px;font-size:14px;color:#67492d}.filterbar button.active{background:#8b5330;color:white}.empty{padding:25px 10px;color:#675a46}@media(max-width:530px){.grid{grid-template-columns:1fr}.art svg{height:170px;max-height:45vw}.plant h3{font-size:22px}.detail{font-size:15px}h1{font-size:25px}}</style></head>
<body><header><div class="wrap"><a class="home" href="./index.html#date-main-menu">⌂ 返回12日導覽主選單</a><h1>🍁 上海・南京 秋色植物圖鑑</h1><p class="intro">左邊看葉形｜右邊看整株與樹幹｜先選城市，再選景點</p></div></header><div class="toolbar"><div class="city"><button id="sh" type="button">上海</button><button id="nj" type="button">南京</button></div></div><main class="content"><section class="selector"><label for="spot">📍 選擇賞秋景點</label><select id="spot"></select><p class="note">每張植物卡提供葉形、樹幹樹形、秋色與景點提示。地點以可觀賞或值得留意為主，非當日已確認變色或精確樹位。</p></section><div class="spot" id="spotinfo"></div><div class="filterbar"><button type="button" id="onlyspot">顯示此景點植物</button><button type="button" id="allcity">看本城市全部植物</button></div><div class="grid" id="cards"></div><a class="back" href="./index.html#date-main-menu">⌂ 返回日期主選單</a></main>
<script>const D={"plants":[["銀杏","扇形葉，葉脈向外放射","灰褐色縱裂樹皮；高大挺直、老樹冠開展","秋轉金黃","fan"],["懸鈴木","大掌狀3–5裂葉，常見球狀果序","樹皮斑駁片狀剝落；主幹粗壯、冠幅寬廣","秋葉黃褐，常稱法國梧桐","star"],["楓香","掌狀3裂至5裂葉，葉序互生","灰褐色縱裂樹皮；主幹挺直、冠卵圓形","橙紅到深紅","star"],["雞爪槭","掌狀深裂5–9片、裂片細尖","灰褐色較平滑樹皮；多分枝、樹冠傘形","紅葉細緻，常栽庭園","maple"],["烏桕","菱形或寬卵形葉，葉尖細長","灰褐色縱裂樹皮；冠形不規則而疏展","紅黃交錯，白色種子醒目","heart"],["水杉","線形小葉對生於羽狀側枝","紅褐色縱裂樹皮；直立主幹、圓錐形樹冠","秋冬轉銅橙色後落葉","needle"],["櫸樹","卵形葉有鋸齒、側脈清楚","灰褐色片狀剝落；寬圓形樹冠","秋轉橙黃至紅褐","oval"],["無患子","羽狀複葉，數對橢圓小葉","灰褐色樹皮；樹冠圓傘形","秋轉金黃；果皮含皂苷","compound"],["欒樹","複葉或二回羽狀複葉、蒴果如燈籠","灰褐色縱裂；樹冠圓傘形","秋葉黃、果實具觀賞性","compound"],["黃連木","偶數羽狀複葉，小葉對生或近對生","粗糙縱裂樹皮；冠形開張","秋紅橙黃，常一樹多彩","compound"]],"spots":[{"city":"上海","name":"武康路・安福路","date":"11/19–20 路線可選","items":[["懸鈴木","路段主要行道樹，秋季黃褐色"]]},{"city":"上海","name":"思南路・衡復街區","date":"上海街區路線","items":[["懸鈴木","行道樹與歷史街屋共同構成秋景"]]},{"city":"上海","name":"上海植物園","date":"SH06 備選景點","items":[["銀杏","園內可觀察，是否進入以當日路線為準"],["楓香","園林秋色樹種，需按現場植物標牌辨認"],["雞爪槭","園內槭樹展示，依現地標牌辨認"],["烏桕","園林秋色觀察，非固定保證樹位"],["水杉","可觀察杉類樹種，請與落羽杉區分"],["櫸樹","可觀察園林喬木，依現地標牌確認"],["無患子","園林及街道常見秋色樹種，依現地標牌確認"]]},{"city":"上海","name":"共青森林公園","date":"額外賞秋備選","items":[["雞爪槭","園區紅葉景觀"],["銀杏","可找秋季黃葉樹木"],["水杉","園區可觀察杉類景觀"]]},{"city":"南京","name":"玄武湖・梁洲","date":"11/22","items":[["銀杏","梁洲銀杏大道，是推薦定點"],["烏桕","沿湖留意紅黃葉，非保證定點"],["水杉","湖畔杉類需和落羽杉辨別"]]},{"city":"南京","name":"清涼山・銀杏谷","date":"11/23","items":[["銀杏","銀杏谷重點觀察；金黃秋景"]]},{"city":"南京","name":"明孝陵・陵園路","date":"11/24","items":[["懸鈴木","陵園路梧桐大道代表樹種"],["銀杏","明孝陵園區可留意"],["雞爪槭","3、4號門一帶可留意"],["欒樹","明孝陵周邊可留意"],["水杉","燕雀湖以落羽杉更出名，別把兩者混為一談"],["烏桕","園區留意彩葉樹，非固定保證點"]]},{"city":"南京","name":"鐘山・靈谷寺","date":"11/24–25 行程區域","items":[["銀杏","寺院及園林秋色"],["櫸樹","林蔭步道可能可見，須核對標牌"],["黃連木","山林可能可見，非保證定點"]]},{"city":"南京","name":"棲霞山・棲霞寺","date":"11/26","items":[["楓香","霜紅苑與桃花湖周邊，紅葉觀賞"],["雞爪槭","紅葉林區可辨認槭樹，依標牌確認"],["銀杏","寺廟與古建築周邊可留意"],["黃連木","山林可能可見，非保證定點"]]}]};const P=Object.fromEntries(D.plants.map(x=>[x[0],x]));let city="南京",idx=0,all=false;
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function leaf(type,color){let core='';if(type==='fan')core='<path d="M50 105 Q10 65 13 28 Q50 3 87 28 Q90 65 50 105Z"/><path d="M50 100L50 22M50 90L27 30M50 90L73 30M50 85L15 50M50 85L85 50" fill="none" stroke="#a96f26" stroke-width="1.2"/>';else if(type==='needle')core='<path d="M50 112V8" stroke="#945d35" stroke-width="3"/>'+Array.from({length:12},(_,i)=>'<path d="M50 '+(15+i*7)+' L'+(10+i%3*2)+' '+(7+i*7)+' M50 '+(15+i*7)+' L'+(90-i%3*2)+' '+(7+i*7)+'" stroke="'+color+'" stroke-width="3" stroke-linecap="round"/>').join('');else if(type==='compound')core='<path d="M20 110Q50 72 75 9" fill="none" stroke="#936c3c" stroke-width="2.5"/>'+Array.from({length:5},(_,i)=>{const y=20+i*17;return '<ellipse cx="'+(61-i*7)+'" cy="'+y+'" rx="11" ry="19" transform="rotate(30 '+(61-i*7)+' '+y+')"/><ellipse cx="'+(79-i*7)+'" cy="'+(y+8)+'" rx="9" ry="17" transform="rotate(-35 '+(79-i*7)+' '+(y+8)+')"/>'}).join('');else if(type==='maple'||type==='star'){const n=type==='maple'?7:5,pts=[];for(let i=0;i<n*2;i++){let a=-Math.PI/2+i*Math.PI/n,r=i%2?30: (type==='maple'?51:47);pts.push((50+Math.cos(a)*r).toFixed(1)+','+(59+Math.sin(a)*r).toFixed(1))}core='<polygon points="'+pts.join(' ')+'"/><path d="M50 110V55M50 75L31 41M50 75L71 41" stroke="#965338" stroke-width="1.6" fill="none"/>'}else core='<path d="M50 112C25 91 16 61 34 28Q51 9 69 28C91 54 73 93 50 112Z"/><path d="M50 110V31" stroke="#a86d48" stroke-width="1.5" fill="none"/>';return '<svg viewBox="0 0 100 125" aria-label="葉片示意圖"><g fill="'+color+'" stroke="#a36d42" stroke-width=".65">'+core+'</g></svg>'}
function tree(color,type){let crown=type==='needle'?'<polygon points="60,9 24,90 96,90" />': '<ellipse cx="60" cy="46" rx="'+(type==='maple'?48:39)+'" ry="'+(type==='maple'?31:38)+'"/>';let blobs=type==='needle'?'':Array.from({length:15},(_,i)=>{const a=i*2.3999;return '<circle cx="'+(60+Math.cos(a)*24).toFixed(1)+'" cy="'+(47+Math.sin(a)*23).toFixed(1)+'" r="'+(8+i%4)+'"/>'}).join('');return '<svg viewBox="0 0 120 125" aria-label="樹形與樹幹示意圖"><path d="M60 112V55M60 85L35 54M60 76L83 50" stroke="#80644d" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M61 112L60 62M56 108L55 77" stroke="#4c3c2b" stroke-width="1.1" fill="none"/><g fill="'+color+'" opacity=".9">'+crown+blobs+'</g><path d="M9 114H111" stroke="#aaad85" stroke-width="3"/></svg>'}
function clr(n){return n==='銀杏'||n==='無患子'||n==='欒樹'?'#e7b72d':n==='水杉'?'#b96d3f':n==='懸鈴木'?'#b99b49':n==='雞爪槭'?'#cb3c48':'#d86b40'}
function update(){const opts=D.spots.filter(x=>x.city===city);idx=Math.min(idx,opts.length-1);const sel=$('spot');sel.innerHTML=opts.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+'（'+esc(x.date)+'）</option>').join('');sel.value=String(idx);const sp=opts[idx];$('sh').classList.toggle('active',city==='上海');$('nj').classList.toggle('active',city==='南京');$('spotinfo').innerHTML='<strong>📍 '+esc(sp.name)+'</strong><small>'+esc(sp.date)+'｜可辨識 '+sp.items.length+' 種植物</small>';$('onlyspot').classList.toggle('active',!all);$('allcity').classList.toggle('active',all);let arr=all?Array.from(new Set(opts.flatMap(x=>x.items.map(y=>y[0])))).map(n=>[n,opts.filter(x=>x.items.some(y=>y[0]===n)).map(x=>x.name).join('、')]):sp.items; $('cards').innerHTML=arr.map(([name,loc])=>{const p=P[name],color=clr(name);return '<article class="plant"><h3>'+esc(name)+'</h3><div class="art">'+leaf(p[4],color)+tree(color,p[4])+'</div><div class="artlabel"><span>左｜葉片</span><span>右｜整株樹形</span></div><div class="detail"><p><b>葉片分辨：</b>'+esc(p[1])+'</p><p><b>樹幹・樹形：</b>'+esc(p[2])+'</p><p><b>植物特性：</b>'+esc(p[3])+'</p><p class="location"><b>📍 可觀賞位置：</b>'+esc(loc)+'</p></div></article>'}).join('');}
$('sh').onclick=()=>{city='上海';idx=0;all=false;update()};$('nj').onclick=()=>{city='南京';idx=0;all=false;update()};$('spot').onchange=e=>{idx=+e.target.value;all=false;update()};$('onlyspot').onclick=()=>{all=false;update()};$('allcity').onclick=()=>{all=true;update()};const q=new URLSearchParams(location.search);if(q.get('city')==='shanghai')city='上海';if(q.get('city')==='nanjing')city='南京';if(q.get('spot')){const ix=D.spots.filter(s=>s.city===city).findIndex(s=>s.name.includes(q.get('spot')));if(ix>=0)idx=ix;}update();</script></body></html>
